# Deploys Mandate on Render (https://render.com) as a Docker web service.
# RENDER_EXTERNAL_URL is picked up automatically as the public URL for PayPal redirects.
services:
  - type: web
    name: mandate
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-5-5
      - key: CHANNEL3_API_KEY
        sync: false
      - key: CATALOG
        value: mock
